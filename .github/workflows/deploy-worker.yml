name: Deploy sync worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bluechat-sync-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Ensure Cloudflare KV namespace exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/7ece58c3241a1b80e660bff102f3352a/storage/kv/namespaces"
          namespace_id="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${api}" | jq -r '.result[] | select(.title == "bluechat-kv") | .id' | head -n 1)"
          if [ -z "${namespace_id}" ]; then
            namespace_id="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"title":"bluechat-kv"}' \
              "${api}" | jq -r '.result.id')"
          fi
          test -n "${namespace_id}"
          sed -i "s/23083394123342c0864cbcb2662a17fe/${namespace_id}/" wrangler.toml
          echo "Cloudflare KV namespace is ready"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
